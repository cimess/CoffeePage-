<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">

   <title>Moniepiont-Demo</title>
   <link rel="stylesheet" href="../home/style.css">

</head>
<body>
  
       <div class="phone-casing">
         <div class="logo-container"><div class="logo-holder"><img src="../home/moniepont-logo/idNVcK80CS_1749452095260.jpeg" alt="moniepoint-logo" class="case-logo"> </div><div class="logo-text"><span class="font-weight-thicker">Monie</span><span>point</span><br><span class="small-text">Business Banking</span></div>
         </div>

         <div class="frame">
          <div class="frame-content">
         <div class="content bg-white">
            <div class="padding">
                  <button class="back-button"><i class="fa-solid fa-arrow-left back-button-icon"></i></button>

               <div><div class="dark-color text-l mg-u-d x-text">Transfer</div>
         <div class="display-flex flex border padding ">

            <div class="grey-color  width display-flex"><span class="xx-text" >₦</span><input type="number" class="width height border-n" inputmode="numeric" pattern="[0-9]*">  </div> 
                
        </div></div>

          <div class="dark-color text-l mg-u-d1 font-weight-thick">Recipient Account Number</div>
         <div class="display-flex flex border padding">
<input type="text" class="width border-n" placeholder="Recipient Account Number">
            </div>

            <div class="display-flex banks-controller"><span class="dark-color">Select Bank</span> </div>
            <details class="drop-down">
               <summary class="bg-lighter-blue link-style">see all</summary>

               <div class="banks-list ">
                  <button class="border2 mg-a bg-white ">Union Bank of Nigeria</button><button class="border2 mg-a bg-white ">Wema Bank</button><button class="border2 mg-a bg-white ">Sterling Bank</button><button class="border2 mg-a bg-white ">Ecobank Nigeria</button><button class="border2 mg-a bg-white ">Jaiz Bank</button><button class="border2 mg-a bg-white ">Providus Bank</button><button class="border2 mg-a bg-white ">Stanbic IBTC Bank</button><button class="border2 mg-a bg-white ">TAJ Bank</button><button class="border2 mg-a bg-white ">Access Bank</button><button class="border2 mg-a bg-white ">GT Bank</button>
                  <button class="border2 mg-a bg-white ">Jaiz Bank</button><button class="border2 mg-a bg-white ">Providus Bank</button><button class="border2 mg-a bg-white ">Stanbic IBTC Bank</button><button class="border2 mg-a bg-white ">TAJ Bank</button><button class="border2 mg-a bg-white ">Access Bank</button><button class="border2 mg-a bg-white ">GT Bank</button>
                  <button class="border2 mg-a bg-white ">Union Bank of Nigeria</button><button class="border2 mg-a bg-white ">Wema Bank</button><button class="border2 mg-a bg-white ">Sterling Bank</button><button class="border2 mg-a bg-white ">Ecobank Nigeria</button><button class="border2 mg-a bg-white ">Jaiz Bank</button><button class="border2 mg-a bg-white ">Providus Bank</button><button class="border2 mg-a bg-white ">Stanbic IBTC Bank</button><button class="border2 mg-a bg-white ">TAJ Bank</button><button class="border2 mg-a bg-white ">Access Bank</button><button class="border2 mg-a bg-white ">GT Bank</button>
                  <button class="border2 mg-a bg-white ">Jaiz Bank</button><button class="border2 mg-a bg-white ">Providus Bank</button><button class="border2 mg-a bg-white ">Stanbic IBTC Bank</button><button class="border2 mg-a bg-white ">TAJ Bank</button><button class="border2 mg-a bg-white ">Access Bank</button><button class="border2 mg-a bg-white ">GT Bank</button>
               </div>
               
            </details>


             <div class="dark-color text-l mg-u-d1 font-weight-thick">Narration (Optional)</div>
         <div class="display-flex flex border padding">
<input type="text" class="width border-n" placeholder="Narration">
            </div>

             <div class="dark-color text-l mg-u-d1 font-weight-thick">Customer Name (Optional)</div>
         <div class="display-flex flex border padding">
<input type="text" class="width border-n" placeholder="Customer Name">
            </div>

<div class="dark-color text-l mg-u-d1 font-weight-thick">Customer Phone (Optional)</div>
         <div class="display-flex flex border padding">
<input type="number" class="width border-n" placeholder="Customer Phone">
            </div>


<div class="dark-color text-l mg-u-d1 font-weight-thick">Customer Email (Optional)</div>
         <div class="display-flex flex border padding">
<input type="email" class="width border-n" placeholder="Customer Email">
            </div>

<button class="button-lb width mg-u-d icon-white">Continue</button>


         </div>
            </div> 
       </div>









        <div class="display-flex frame-button">
      <button class="transparent back-button"><i class="fa-solid fa-caret-left icon-white x-text"></i></button>
       <button class="transparent"><i class="fa-solid fa-circle icon-white"></i></button>
        <button class="transparent"><i class="fa-solid fa-square icon-white"></i></button>
        </div>
         </div>
