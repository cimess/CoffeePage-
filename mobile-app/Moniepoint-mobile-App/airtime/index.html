<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Moniepiont-Demo</title>
   <link rel="stylesheet" href="../home/style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
   <link rel="stylesheet" href="../operations.css">


</head>
<body>
  
       <div class="phone-casing">
         <div class="logo-container"><div class="logo-holder"><img src="../home/moniepont-logo/idNVcK80CS_1749452095260.jpeg" alt="moniepoint-logo" class="case-logo"> </div><div class="logo-text"><span class="font-weight-thicker">Monie</span><span>point</span><br><span class="small-text">Business Banking</span></div>
         </div>

         <div class="frame">
          <div class="frame-content">


            <div  class=" dark-color dropdown display-flex flex margin-10 ">
   <div data-value="MTN" class="border-n width text-l">MTN</div>
    <div data-value="Airtel" class="border-n width text-l">Airtel</div>
     <div data-value="9Mobile" class="border-n width text-l">9Mobile</div>
      <div data-value="GLO" class="border-n width text-l">GLO</div>
      <button class="button-white b margin-10 border-n al-s bg-white close-button al-s">Close</button>
</div>


         <div class="content bg-white">

            <div class="padding">
<button class="back-button"><i class="fa-solid fa-arrow-left back-button-icon"></i></button>


               <div><div class="dark-color text-l mg-u-d x-text">Airtime</div>
         <div class="display-flex flex border padding ">
            <span class="grey-color small-text margin-10">Enter Amount</span>
            <div class="grey-color  width display-flex"><span class="xx-text" >₦</span><input type="number" class="width height border-n" inputmode="numeric" pattern="[0-9]*">  </div> 
                
        </div></div>

          <div class="dark-color text-l mg-u-d1 font-weight-thick ">Airtime Network</div>


         <div class="display-flex border padding flex-between p-relative">
            <button class="display-flex flex-between width border-n bg-white dropdown-b"><span class="dark-color item-div">Airtime Network </span>
            <i class="fa-solid fa-chevron-down border-n o bg-white"></i></button>



            </div>



             <div class="dark-color text-l mg-u-d1 font-weight-thick">Recipient Phone Number </div>
         <div class="display-flex flex border padding">
<input type="text" class="width border-n" placeholder="Recipient Phone Number">
            </div>

    

<button class="button-lb width mg-u-d icon-white">Continue</button>


         </div>
            </div> 
       </div>









        <div class="display-flex frame-button">
      <button class="transparent back-button"><i class="fa-solid fa-caret-left icon-white x-text"></i></button>
       <button class="transparent"><i class="fa-solid fa-circle icon-white"></i></button>
        <button class="transparent"><i class="fa-solid fa-square icon-white"></i></button>
        </div>
         </div>
       <script src="../home/script.js"></script>
</body>
</html>
